<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#03000a">
    <meta name="robots" content="noindex">
    <title>404 — Сторінку не знайдено | Diana Tsiolkovska</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&family=Unbounded:wght@600;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #03000a;
            color: #f4f4f4;
            font-family: 'Manrope', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-family: 'Unbounded', sans-serif;
            font-size: clamp(4rem, 20vw, 9rem);
            font-weight: 900;
            background: linear-gradient(90deg, #00fff9, #ff00c1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        p { font-size: 1.1rem; opacity: 0.85; margin: 10px 0 30px; }
        a {
            font-family: 'Unbounded', sans-serif;
            text-transform: uppercase;
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
            text-decoration: none;
            padding: 15px 40px;
            border-radius: 50px;
            background: linear-gradient(90deg, #7b2cbf, #ff00c1);
            box-shadow: 0 0 25px rgba(123, 44, 191, 0.5);
        }
    </style>
</head>
<body>
    <h1>404</h1>
    <p>Такої сторінки не існує.</p>
    <a href="/">На головну</a>
</body>
</html>
